[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "martin-agent"
dynamic = ["version"]
description = "命令行 Agent 框架：ReAct / Plan-and-Solve / Reflection / AutoGen 风格 / LangGraph"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "llm", "react", "plan-and-solve", "reflection", "langgraph", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
# 模式 5 专用；不装也能跑其余四种模式
langgraph = [
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
# 装好（pip install -e .）后可在任意目录运行，不依赖 cwd
martin-agent = "martin_agent.main:main"

[project.urls]
Repository = "https://github.com/Seven-second-fish/MartinAgent"
Changelog = "https://github.com/Seven-second-fish/MartinAgent/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["martin_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=martin_agent --cov-report=term-missing"

[tool.coverage.run]
omit = ["martin_agent/main.py"]
