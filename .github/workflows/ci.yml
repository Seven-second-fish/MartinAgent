name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖（含模式 5 与测试依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,langgraph]"

      - name: 运行测试并统计覆盖率
        run: python -m pytest

      - name: 校验包可构建
        run: python -m pip install --quiet build && python -m build --wheel
